function lineSvg(values,{spark=false,color='var(--purple)'}={}){const w=spark?100:460,h=spark?42:184,pad=spark?2:7;const pts=values.map((v,i)=>`${pad+i*((w-2*pad)/Math.max(1,values.length-1))},${(h-pad)-(clamp(v,0,100)/100)*(h-2*pad)}`).join(' ');if(spark)return `<svg class="spark" viewBox="0 0 100 42" aria-hidden="true"><polyline points="${pts}" stroke="${color}"/></svg>`;const area=`${pad},${h-pad} ${pts} ${w-pad},${h-pad}`;return `<svg class="price-chart" role="img" aria-label="Simulated historical price chart" viewBox="0 0 460 184" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="g-${ui.marketPeriod}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9251ff" stop-opacity=".22"/><stop offset="1" stop-color="#9251ff" stop-opacity="0"/></linearGradient></defs>${[44,94,144].map(y=>`<path class="chart-grid" d="M7 ${y} H453"/>`).join('')}<polygon points="${area}" fill="url(#g-${ui.marketPeriod})"/><polyline points="${pts}" fill="none" stroke="#995aff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function marketList(){let ms=allMarkets.filter(m=>m.talentId).map(m=>market(m.id));const q=ui.search.trim().toLowerCase();if(q)ms=ms.filter(m=>(m.name+' '+m.cat).toLowerCase().includes(q));if(ui.marketFilter==='TRENDING')ms=ms.filter(m=>Math.abs(m.movement)>=4);if(ui.marketFilter==='TALENT / 365')ms=ms.filter(m=>!!m.talentId);if(ui.marketFilter==='CLOSING SOON')ms=ms.filter(m=>daysUntil(m.close)<80);if(ui.marketFilter==='NEW')ms=ms.filter(m=>new Date(m.created).getTime()>new Date('2026-10-06').getTime());if(ui.marketSort==='VOLUME')ms.sort((a,b)=>b.volume-a.volume);if(ui.marketSort==='MOVEMENT')ms.sort((a,b)=>Math.abs(b.movement)-Math.abs(a.movement));if(ui.marketSort==='TIME')ms.sort((a,b)=>new Date(a.close)-new Date(b.close));return ms.length?`<div class="market-list"><div class="row" style="padding:12px 15px;border-bottom:1px solid var(--border)"><div class="label" style="margin:0">${ms.length} DEMO MARKETS</div><div class="label" style="margin:0">YES / NO</div></div>${ms.map(m=>`<button class="market-row" data-go="/market/${m.id}" aria-label="Open ${attr(m.name)}"><div style="min-width:0"><div class="label" style="font-size:10px;margin:0 0 5px">${escaped(m.cat)}</div><div class="name">${escaped(m.name)}</div><div class="prices"><span class="green">${fmt(m.yes)}¢ YES</span><span class="red">${fmt(100-m.yes)}¢ NO</span><span class="muted">${daysUntil(m.close)}D</span></div></div>${lineSvg(mHistory(m),{spark:true,color:m.id==='ai'?'#9251ff':'#7e7c8d'})}</button>`).join('')}</div>`:blank('No markets match your search.','Clear filters','/markets')}
function marketPage(){return `<div class="container"><div class="eyebrow" style="margin:5px 0 20px">[ MARKETS · SIMULATED SIGNALS ]</div><h1 style="font-size:42px">Milestone forecasts.</h1><p>Explore YES or NO on fictional talent milestones. Observe simulated price discovery using DSC demo credits—not real money.</p><div class="row" style="margin:18px 0 23px"><span class="pill purple">● INTERACTIVE DEMO</span><button class="btn small secondary" data-go="/guide">How markets work ${icon('arrow')}</button></div><div class="card" style="padding:0;overflow:hidden"><div class="stat-grid"><div class="stat">${icon('pulse')}<div class="label">OPEN MARKETS</div><div class="stat-num">${allMarkets.filter(m=>m.talentId&&!market(m.id).resolved).length}</div><small>Fictional examples</small></div><div class="stat">${icon('flame')}<div class="label">DEMO VOLUME</div><div class="stat-num">${fmt(allMarkets.filter(m=>m.talentId).reduce((a,m)=>a+m.volume,0)/1e6,1)}M</div><small>Seeded, not real trades</small></div><div class="stat">${icon('sparkles')}<div class="label">BIGGEST MOVE</div><div class="stat-num">+9.2¢</div><small>Illustrative movement</small></div><div class="stat">${icon('clock')}<div class="label">SETTLEMENT</div><div class="stat-num">Demo</div><small>Manual test control</small></div></div></div><div class="card"><div class="field" style="margin-bottom:13px"><label for="market-search">SEARCH MARKETS</label><input id="market-search" type="search" placeholder="Search topics, categories..." value="${attr(ui.search)}"></div><div class="chips">${['ALL','TRENDING','TALENT / 365','CLOSING SOON','NEW'].map(x=>`<button class="chip ${ui.marketFilter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="chips" style="margin-top:12px">${['VOLUME','MOVEMENT','TIME'].map(x=>`<button class="chip ${ui.marketSort===x?'active':''}" data-sort="${x}">${x}</button>`).join('')}</div></div><div id="markets-output">${marketList()}</div><div class="section-head"><h3>Find the next breakout talent</h3></div><p class="small">DiSTRUB Talent / 365 connects objectively measurable potential with verified progress.</p><button class="btn full secondary" data-go="/talents">Explore talents ${icon('arrow')}</button></div>`}
function marketDetail(id){const m=market(id);if(!m)return missing();const p=ui.selectedSide==='YES'?m.yes:100-m.yes;const fullHistory=mHistory(m),history=ui.marketPeriod==='1D'?fullHistory.slice(-5):ui.marketPeriod==='7D'?fullHistory.slice(-12):ui.marketPeriod==='30D'?fullHistory.slice(-28):fullHistory,periods=['1D','7D','30D','ALL'];const u=user();const d=daysUntil(m.close);return `<div class="container"><button class="back" data-go="/markets">${icon('back')} All markets</button><div class="card" style="padding:20px;margin-top:5px"><div class="eyebrow">${escaped(m.cat)}</div><h1 style="font-size:26px;margin-top:13px">${escaped(m.name)}</h1>${m.resolved?`<span class="pill green">Resolved in this demo: ${escaped(m.resolved)}</span>`:`<span class="pill purple">● Demo market · ${d} days remaining</span>`}<div class="market-quote"><div><div class="label" style="margin-top:25px">YES PRICE</div><div class="data-big" style="font-size:55px">${m.yes}¢</div></div><div style="color:${m.movement>=0?'var(--green)':'var(--red)'}" class="mono">${m.movement>=0?'+':''}${fmt(m.movement,1)}¢ 30d</div></div><div class="chart-area">${lineSvg(history)}</div><div class="history-hint"><span>OLDER</span><span>SIMULATED TRADE HISTORY</span><span>LATEST</span></div><div class="chips" style="justify-content:center;margin:12px 0 19px">${periods.map(x=>`<button class="chip ${ui.marketPeriod===x?'active':''}" data-period="${x}">${x}</button>`).join('')}</div><div class="quotes"><div><div class="label">TRADERS*</div><div class="value">${fmt(m.traders)}</div></div><div><div class="label">SPREAD*</div><div class="value">2¢</div></div><div><div class="label">CLOSES IN</div><div class="value">${d}D</div></div></div><p class="disclaimer" style="margin:10px 0 0">* Seeded fictional indicators; this is not a live order book.</p></div>${!m.resolved?`<div class="card"><div class="row" style="margin-bottom:16px"><h3 style="margin:0">Place a simulated forecast</h3><span class="pill">NO REAL MONEY</span></div><div class="trade-switch"><button type="button" class="${ui.selectedSide==='YES'?'active yes':''}" data-side="YES">YES <strong>${m.yes}¢</strong></button><button type="button" class="${ui.selectedSide==='NO'?'active no':''}" data-side="NO">NO <strong>${100-m.yes}¢</strong></button></div><form id="order-form" data-market="${m.id}"><div class="field"><label>Free forecast credits to spend</label><input id="order-amount" name="amount" type="number" inputmode="decimal" min="10" step="0.01" value="${ui.amount}" required><div class="number-pills">${[100,500,1000,2500].map(n=>`<button type="button" data-quick-amount="${n}">${n}</button>`).join('')}</div></div><div id="order-estimate">${orderEstimate(m)}</div><div style="margin-top:21px"><button class="btn primary full" type="submit">Review ${ui.selectedSide} order ${icon('arrow')}</button></div></form><p class="disclaimer" style="text-align:center;margin:15px 0 0">Demo execution changes a local simulated price. There is no trading venue or real settlement.</p></div>`:`<div class="success-box">The ${escaped(m.resolved)} outcome has been settled locally. No further demo orders can be placed on this market.</div>`}<div class="card"><div class="tabs"><button class="${ui.marketTab==='ORDER'?'active':''}" data-market-tab="ORDER">About</button><button class="${ui.marketTab==='RULES'?'active':''}" data-market-tab="RULES">Resolution rules</button><button class="${ui.marketTab==='HOLDINGS'?'active':''}" data-market-tab="HOLDINGS">My position</button></div>${ui.marketTab==='ORDER'?`<div style="padding-top:16px"><p>${escaped(m.description)}</p><div class="metric"><span>Scheduled close</span><strong>${timeStamp(m.close)}</strong></div><div class="metric"><span>Reference source</span><span class="mono small">${escaped(m.source)}</span></div></div>`:ui.marketTab==='RULES'?`<p style="padding-top:16px">${escaped(m.rule)}</p><div class="notice">Real-money launch would require unambiguous published rules, dispute handling, market oversight and regulatory clearance.</div>`:`<div style="padding-top:16px">${!u?blank('Sign in to see positions.','Sign in','/signin'):positionForMarket(u,m.id)}</div>`}</div>${u&&!m.resolved&&u.positions.some(p=>p.marketId===m.id)?`<button class="btn full secondary" data-action="settle" data-id="${m.id}" style="margin-bottom:15px">${icon('sparkles')} Demo Lab: simulate final outcome</button>`:''}${m.talentId?`<div class="card"><div class="eyebrow">LINKED TALENT PROGRAMME</div><p class="small" style="margin:9px 0">Follow the associated 365-day goals, documented resources and updates separately from this prediction contract.</p><button class="btn secondary full" data-go="/talent/${m.talentId}">View ${escaped(talent(m.talentId)?.alias||'talent')} progress ${icon('arrow')}</button></div>`:''}<button class="btn full ghost" data-go="/markets">${icon('back')} Back to markets</button></div>`}
function orderEstimate(m){const amount=Number(ui.amount)||0,unit=(ui.selectedSide==='YES'?m.yes:100-m.yes)/100,shares=unit>0?Math.floor(amount/unit):0,cost=Number((shares*unit).toFixed(2));return `<div class="metric"><span class="label">SHARES</span><strong class="mono">${fmt(shares)}</strong></div><div class="metric"><span class="label">COST</span><strong class="mono">${money(cost)}</strong></div><div class="metric"><span class="label">PAYOUT IF CORRECT</span><strong class="mono green">${fmt(shares)} DSC</strong></div><div class="metric"><span class="label">AVAILABLE</span><strong class="mono">${fmt(user()?.balance||0)} DSC</strong></div>`}
function positionForMarket(u,id){const pos=u.positions.filter(x=>x.marketId===id&&x.shares>0);return pos.length?pos.map(x=>`<div class="activity-item"><div class="row"><strong>${escaped(x.side)} · ${fmt(x.shares)} shares</strong><span class="mono green">${money(x.shares*(x.side==='YES'?market(id).yes:100-market(id).yes)/100)}</span></div><div class="small muted">Entry price ${fmt(x.entryPrice)}¢ · paid ${money(x.cost)}</div><button class="btn small secondary" style="margin-top:9px" data-action="sell" data-id="${x.id}">Sell shares</button></div>`).join(''):blank('No position in this market yet.')}
function talentCard(t){const day=days(t.start),pct=clamp(100*t.funded/t.goal,0,100),progress=clamp(100*t.currentNumber/t.targetNumber,0,100);return `<article class="card talent-card"><div class="row"><div class="eyebrow">ACTIVE · FICTIONAL DEMO</div><span class="mono muted small">${day} / 365</span></div><div class="talent-head" style="margin-top:17px"><div class="avatar">${escaped(t.alias[0])}</div><div><strong style="font-size:18px">${escaped(t.alias)}</strong><div class="small muted">${escaped(t.niche)} · ${escaped(t.region)}</div></div></div><p style="margin:13px 0">${escaped(t.tagline)}</p><div class="row detail-row"><span>RESOURCES COVERED</span><span>${money(t.funded)} / ${money(t.goal)}</span></div><div class="progress-track" style="margin:8px 0 13px"><div style="width:${pct}%"></div></div><div class="row" style="margin-top:13px"><span class="small muted">Milestone progress ${Math.floor(progress)}%</span><span class="pill purple">Simulated forecast ${t.forecast}%</span></div><button class="btn secondary full" style="margin-top:18px" data-go="/talent/${t.id}">View programme ${icon('arrow')}</button></article>`}
function talentsPage(){const ts=initialTalents.map(t=>talent(t.id)).filter(t=>(ui.talentSearch?`${t.alias} ${t.niche} ${t.tagline}`.toLowerCase().includes(ui.talentSearch.toLowerCase()):true)).filter(t=>ui.category==='ALL'||t.niche.includes(ui.category));return `<div class="container"><div class="eyebrow" style="margin-top:5px">DiSTRUB / TALENT, NOT POPULARITY</div><h1 style="font-size:39px;margin:20px 0">Fund a talent's next 365 days.</h1><p>Essential resources. A clear milestone. Exactly 365 days to make progress. Focus on documented skills—not follower counts.</p><div class="btn-row" style="margin:20px 0"><button class="btn primary" data-go="/apply">Apply as talent ${icon('arrow')}</button><button class="btn secondary" data-go="/guide">How it works</button></div><div class="card"><div class="field" style="margin-bottom:12px"><label>SEARCH TALENT</label><input id="talent-search" type="search" placeholder="Skills, alias, niche..." value="${attr(ui.talentSearch)}"></div><div class="chips">${['ALL','FITNESS','ENGINEERING','BEAUTY','SOFTWARE','FOOD'].map(x=>`<button class="chip ${ui.category===x?'active':''}" data-category="${x}">${x}</button>`).join('')}</div></div><div class="row" style="margin:23px 0 15px"><div><div class="eyebrow">01 / TALENTS</div><h2 style="margin:6px 0 0">Potential deserves a starting line.</h2></div></div><p class="small">${ts.length} fictional adults · No real funding or screening is active.</p><div id="talents-output">${ts.length?ts.map(talentCard).join(''):blank('No talents match these filters.','View all talents','/talents')}</div><div class="notice">A talent's identity remains private in this prototype. Public aliases and broad regions protect anonymity; verification is not live.</div></div>`}
function detailBudget(t){return t.budget.map(item=>`<div class="activity-item"><div class="row"><strong>${escaped(item.name)}</strong><span class="mono small">${fmt(item.funded)} / ${fmt(item.goal)} DSC</span></div><div class="progress-track" style="margin:10px 0"><div style="width:${clamp(100*item.funded/item.goal,0,100)}%"></div></div>${item.funded<item.goal?`<button class="btn small secondary" data-action="fund" data-talent="${t.id}" data-resource="${item.id}">Allocate resource units ${icon('arrow')}</button>`:`<span class="small green">Covered</span>`}</div>`).join('')}
function talentDetail(id){const t=talent(id);if(!t)return missing();const day=days(t.start),u=user(),followed=!!u?.following.includes(id),tps=['OVERVIEW','MILESTONES','UPDATES','SUPPORT','FORECAST'];const done=t.milestones.filter(x=>x.done).length;return `<div class="container"><button class="back" data-go="/talents">${icon('back')} Discover talents</button><div class="card"><div class="row"><div class="eyebrow">TALENT / 365 · FICTIONAL</div><span class="mono muted small">${day} / 365</span></div><div class="talent-head" style="margin:18px 0"><div class="avatar" style="width:65px;height:65px;font-size:27px">${escaped(t.alias[0])}</div><div><h1 style="font-size:27px;margin:0 0 4px">${escaped(t.alias)}</h1><div class="small muted">${escaped(t.niche)} · ${escaped(t.region)}</div></div></div><p class="text-white" style="font-size:16px">${escaped(t.tagline)}</p><div class="row" style="gap:8px;flex-wrap:wrap"><span class="pill purple">${t.forecast}% modelled forecast</span><span class="pill">${done}/${t.milestones.length} milestones</span></div><div class="divider"></div><div class="row" style="margin-bottom:8px"><span class="label">RESOURCE BUDGET</span><span class="mono small">${fmt(t.funded)} / ${fmt(t.goal)} DSC</span></div><div class="progress-track"><div style="width:${clamp(t.funded/t.goal*100,0,100)}%"></div></div><div class="row" style="margin:20px 0 8px"><span class="label">CORE SUCCESS METRIC</span><span class="mono small">${fmt(t.currentNumber)} / ${fmt(t.targetNumber)}</span></div><div class="progress-track"><div style="width:${clamp(t.currentNumber/t.targetNumber*100,0,100)}%"></div></div><p class="small" style="margin:9px 0">${escaped(t.target)}</p><div class="btn-row" style="margin-top:20px"><button class="btn primary" data-talent-tab="SUPPORT">Support resources</button><button class="btn secondary" data-action="follow" data-id="${id}">${icon('heart')} ${followed?'Following':'Follow'}</button></div><button class="btn secondary full" style="margin-top:9px" data-go="/market/talent-${id}">${icon('chart')} Forecast the 365-day milestone (demo) ${icon('arrow')}</button></div><div class="card"><div class="tabs">${tps.map(tab=>`<button class="${ui.talentTab===tab?'active':''}" data-talent-tab="${tab}">${tab.toLowerCase().replace(/^./,c=>c.toUpperCase())}</button>`).join('')}</div><div style="padding-top:18px">${ui.talentTab==='OVERVIEW'?`<h3>Why this talent?</h3><p>${escaped(t.story)}</p><div class="metric"><span>Programme type</span><strong>365-day milestone</strong></div><div class="metric"><span>Resource model</span><strong>Direct allocation</strong></div><div class="metric"><span>Public identity</span><strong>Anonymous alias</strong></div><div class="notice">Applications are reviewed before admission in a real service. The example programme is entirely fictional.</div>`:ui.talentTab==='MILESTONES'?`<h3>Evidence-driven milestones</h3>${t.milestones.map((m,i)=>`<div class="feed-item"><span class="pill ${m.done?'green':''}">${m.done?icon('check'):fmt(i+1)}</span><div><strong>${escaped(m.name)}</strong><div class="small muted">${m.done?'Completed · fictional demo record':'Not yet completed'}</div></div></div>`).join('')}`:ui.talentTab==='UPDATES'?`<div class="row"><h3>Progress log</h3><span class="small muted">${t.updates.length} updates</span></div>${t.updates.map(x=>`<div class="activity-item"><div class="row"><strong>${escaped(x.title)}</strong><span class="mono small muted">${timeStamp(x.date)}</span></div><p class="small" style="margin:6px 0">${escaped(x.body)}</p><span class="pill ${x.status==='Demo-reviewed'?'green':''}">${escaped(x.status||'Unverified')}</span></div>`).join('')}`:ui.talentTab==='SUPPORT'?`<h3>Fund resources, not an individual</h3><p class="small">In this demo, allocations spend separate virtual resource units and increase the selected fictional resource budget. They do not buy an equity stake, prediction contract or investment return.</p>${detailBudget(t)}<button class="btn full secondary" style="margin-top:12px" data-go="/wallet">View your resource history ${icon('arrow')}</button>`:`<h3>Predict milestone success</h3><div class="row"><span class="label">MODEL ESTIMATE</span><div class="data-big purple">${t.forecast}%</div></div><p>Illustrative model probability for <strong>${escaped(t.target)}</strong>, by day 365.</p><div class="divider"></div><div class="row"><div><div class="label">TRADED YES PRICE (LOCAL DEMO)</div><div class="data-big">${market('talent-'+id).yes}¢</div></div><button class="btn primary small" data-go="/market/talent-${id}">Trade YES / NO ${icon('arrow')}</button></div><div class="notice">The forecast is a fixed illustrative estimate; the demo market price changes after locally simulated trades. A real market needs counterparties, independent settlement, liquidity and legal review.</div>`}</div></div><div class="card"><div class="row"><h3 style="margin:0">Audience reach</h3><button class="touch-link" data-go="/reach">All polls ${icon('arrow')}</button></div><p class="small">Follow trends and opt-in research signals from niche communities.</p>${polls().filter(x=>x.talent===id).slice(0,1).map(x=>pollCard(x,true)).join('')||`<span class="small muted">No community poll for this programme yet.</span>`}</div></div>`}
function pollCard(p,compact=false){const u=user(),vote=u?.votes?.[p.id];const total=p.av+p.bv,percent=Math.round(100*p.av/Math.max(1,total));return `<div class="${compact?'subtle-card':'card'}"><div class="row"><span class="eyebrow">COMMUNITY SIGNAL</span><span class="mono small muted">${fmt(total)} demo votes</span></div><h3 style="font-size:${compact?'15':'18'}px;margin-top:12px">${escaped(p.question)}</h3>${vote?`<div class="row"><span class="small">${escaped(p.a)}</span><strong class="mono">${percent}%</strong></div><div class="poll-track"><div class="yes" style="width:${percent}%"></div><div class="no"></div></div><div class="row"><span class="small">${escaped(p.b)}</span><strong class="mono">${100-percent}%</strong></div><div class="small green" style="margin-top:9px">${icon('check')} You voted for ${escaped(vote==='A'?p.a:p.b)}</div>`:`<div class="stack sm"><button class="btn secondary full small" data-action="vote" data-id="${p.id}" data-option="A">${escaped(p.a)}</button><button class="btn secondary full small" data-action="vote" data-id="${p.id}" data-option="B">${escaped(p.b)}</button></div>`}<p class="disclaimer" style="margin:9px 0 0">Survey only, not financial trading. Seeded fictional votes.</p></div>`}

function activityPage(){const u=user();if(!u)return gate('activity');const app=u.applications[0],totalOrders=u.transactions.filter(t=>t.type==='buy').length;const interest=u.following;return `<div class="container"><div class="eyebrow">YOUR JOURNEY</div><h1 style="font-size:36px;margin:13px 0">Activity & progress.</h1><p>Everything you do is recorded locally in this browser for testing.</p><div class="stack-stat" style="margin:21px 0"><div><div class="label">DEMO ORDERS</div><div class="value">${totalOrders}</div></div><div><div class="label">FOLLOWED TALENTS</div><div class="value">${interest.length}</div></div></div><div class="section-head"><h3>My talent programme</h3></div>${app?`<div class="card"><div class="row"><span class="pill purple">${escaped(app.status)}</span><span class="small mono muted">${timeStamp(app.submitted)}</span></div><h3 style="margin:14px 0 5px">${escaped(app.alias)}</h3><p class="small">${escaped(app.milestone)}</p><div class="metric"><span>Review state</span><strong>${escaped(app.status)}</strong></div><div class="notice">The screening process is not connected to an actual review team in this local prototype. Your submission is stored only on this device.</div><button class="btn secondary full" data-go="/application">View application & updates ${icon('arrow')}</button></div>`:`<div class="card"><h3>Make your potential visible.</h3><p class="small">Apply for a 365-day demo programme. Share an alias, measurable goal, resource requirements and evidence.</p><button class="btn primary full" data-go="/apply">Apply as a talent ${icon('arrow')}</button></div>`}<div class="section-head"><h3>Following</h3><button class="touch-link" data-go="/talents">Discover more ${icon('arrow')}</button></div>${interest.length?interest.map(id=>{const t=talent(id);return t?`<div class="activity-item"><div class="row"><div><strong>${escaped(t.alias)}</strong><div class="small muted">${days(t.start)} / 365 days · ${t.currentNumber}/${t.targetNumber} ${escaped(t.unit function guidePage(){return `<div class="container"><button class="back" data-go="/">${icon('back')} Home</button><div class="eyebrow">HOW DIST R UB WORKS</div><h1 style="font-size:37px;margin:16px 0 22px">From potential to probability.</h1><div class="how-grid"><div class="how-card"><span class="pill purple">LAYER 01</span><h3 style="margin-top:14px">Prediction markets</h3><p>Choose a yes-or-no question with clearly defined resolution criteria. A YES contract priced at 49¢ implies roughly 49% probability under simple binary-payoff assumptions. Trade virtual shares and track unrealized results.</p></div><div class="how-card"><span class="pill purple">LAYER 02</span><h3 style="margin-top:14px">Talent / 365</h3><p>Eligible applicants submit verifiable skills, an anonymous alias, a single measurable goal, a resource plan and evidence. Approved talent would receive essential resources through controlled payments, not unrestricted cash.</p></div><div class="how-card"><span class="pill purple">LAYER 03</span><h3 style="margin-top:14px">Reach</h3><p>Creators can ask their community questions to better understand niche demand. Research polls and their respondents must be kept separate from predictions to prevent manipulation.</p></div><div class="how-card"><span class="pill purple">LAYER 04</span><h3 style="margin-top:14px">Milestone-based intelligence</h3><p>Objective progress evidence should inform forecast models and, where permitted, clearly specified future prediction markets. A predicted probability is not automatically a market price.</p></div></div><div class="section-head"><h3>What works in this demo?</h3></div>${[['check','Device-local simulation, separate from your DiSTRUB account'],['check','Search, filters and detailed market rules'],['check','Virtual YES/NO orders, simulated price changes, position sales and outcome settlement'],['check','Talent applications, follows, evidence notes and resource allocations'],['check','Community polls, transaction export and a function orderPreview(){const m=market(currentRoute().split('/')[2]);if(!m)return;const el=document.getElementById('order-estimate');if(el)el.innerHTML=orderEstimate(m)}
function exportCsv(){const u=user();if(!u)return;const rows=[['Date','Type','Description','Amount DSC'],...u.transactions.map(x=>[x.at,x.type,x.label,x.amount])];const csv=rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='distrub-demo-transactions.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('CSV export created.')}
function changeMarketPrice(id,side,amount,buy){const m=market(id),delta=clamp(Math.round(amount/350),1,7)*(side==='YES'?1:-1)*(buy?1:-1),next=clamp(m.yes+delta,2,98),history=mHistory(m).slice(-49);history.push(next);db.marketChanges[id]={...(db.marketChanges[id]||{}),yes:next,movement:Number((next-m.yes+(m.movement||0)).toFixed(1)),history,volume:m.volume+amount,traders:m.traders+(buy?1:0)}}
function formData(form){return new FormData(form)}
function formStr(fd,key){return String(fd.get(key)||'').trim()}
async function handleForm(e){e.preventDefault();const form=e.target,id=form.getAttribute('id'),fd=formData(form),u=user();try{
if(id==='order-form'){if(!requireAuth(currentRoute()))return;const m=market(form.dataset.market);if(!m||m.resolved)throw Error('This demo market is closed.');const amount=Number(fd.get('amount')),price=(ui.selectedSide==='YES'?m.yes:100-m.yes)/100,shares=Math.floor(amount/price),cost=Number((shares*price).toFixed(2));if(!Number.isFinite(amount)||amount<10||shares<1)throw Error('Enter at least 10 DSC to place an order.');if(cost>u.balance+0.000001)throw Error('Insufficient demo balance. Add credits in Wallet.');ui.amount=amount;showModal('review',{id:m.id,side:ui.selectedSide,price:price*100,shares,cost});return}
if(id==='sell-form'){if(!u)throw Error('Sign in first.');const index=u.positions.findIndex(p=>p.id===formStr(fd,'id'));if(index<0)throw Error('Position not found.');const p=u.positions[index],m=market(p.marketId);if(m.resolved)throw Error('Settled positions cannot be sold.');const shares=Number(fd.get('shares'));if(!Number.isInteger(shares)||shares<1||shares>p.shares)throw Error('Invalid share quantity.');const price=(p.side==='YES'?m.yes:100-m.yes)/100,proceeds=Number((shares*price).toFixed(2));const basis=p.cost*(shares/p.shares);u.balance=Number((u.balance+proceeds).toFixed(2));p.cost=Number((p.cost-basis).toFixed(2));p.shares-=shares;if(!p.shares)u.positions.splice(index,1);transaction(u,'sell',`Sold ${fmt(shares)} ${p.side} shares · ${m.cat}`,proceeds);notify(u,'Shares sold',`${fmt(shares)} ${p.side} demo shares sold for ${money(proceeds)}.`);changeMarketPrice(m.id,p.side,proceeds,false);save();ui.modal=null;toast(`Sold ${fmt(shares)} shares for ${money(proceeds)}.`);go('/wallet');return}
if(id==='fund-form'){if(!u)throw Error('Please sign in.');const tid=formStr(fd,'talent'),rid=formStr(fd,'resource'),t=talent(tid),r=t?.budget.find(q=>q.id===rid),amount=Number(fd.get('amount'));if(!r)throw Error('This resource does not exist.');const remain=Number((r.goal-r.funded).toFixed(2));if(!Number.isFinite(amount)||amount<1||amount>remain+.0001||amount>u.resourceBalance+.0001)throw Error('Allocation exceeds your balance or remaining resource budget.');const budget=JSON.parse(JSON.stringify(t.budget)),b=budget.find(x=>x.id===rid);b.funded=Number((b.funded+amount).toFixed(2));db.talentChanges[tid]={...(db.talentChanges[tid]||{}),funded:Number((t.funded+amount).toFixed(2)),budget};u.resourceBalance=Number((u.resourceBalance-amount).toFixed(2));u.supports.push({id:uid(),talentId:tid,resourceId:rid,resourceName:r.name,amount,at:NOW().toISOString()});resourceTransaction(u,'support',`Resource support · ${t.alias} / ${r.name}`,-amount);notify(u,'Resource allocation recorded',`${money(amount)} assigned to ${t.alias}: ${r.name}. Fictional demo only.`);save();ui.modal=null;ui.talentTab='SUPPORT';toast('Resource allocation saved locally.');go('/talent/'+tid);return}
if(id==='apply-1'){ui.apply={...ui.apply,alias:formStr(fd,'alias'),niche:formStr(fd,'niche'),region:formStr(fd,'region'),story:formStr(fd,'story')};if(ui.apply.story.length<25)throw Error('Add at least 25 characters describing your talent.');ui.applyStep=2;render();window.scrollTo(0,0);return}
if(id==='apply-2'){const current=Number(fd.get('baseline')),target=Number(fd.get('target'));if(!Number.isInteger(current)||!Number.isInteger(target)||target<=current)throw Error('Your target must be a whole number greater than your starting value.');ui.apply={...ui.apply,milestone:formStr(fd,'milestone'),metric:formStr(fd,'metric'),baseline:current,target,proof:formStr(fd,'proof')};ui.applyStep=3;render();window.scrollTo(0,0);return}
if(id==='apply-3'){if(!u)throw Error('Sign in first.');if(u.applications.length)throw Error('You already submitted an application.');const a={...ui.apply,resources:formStr(fd,'resources'),request:Number(fd.get('request')),status:'SAVED DEMO APPLICATION · REVIEW UNAVAILABLE',submitted:NOW().toISOString(),updates:[]};if(a.resources.length<20||!Number.isFinite(a.request)||a.request<100||a.request>50000)throw Error('Please provide a valid resource description and budget.');u.applications.unshift(a);notify(u,'Application submitted',`Your programme ${a.alias} is saved as pending demo review. No actual team receives this submission.`);save();ui.applyStep=1;ui.apply={};toast('Demo application submitted.');go('/application');return}
if(id==='create-poll'){if(!u)throw Error('Sign in to create a poll.');const question=formStr(fd,'question'),a=formStr(fd,'a'),b=formStr(fd,'b');if(question.length<12||a.length<2||b.length<2||a.toLowerCase()===b.toLowerCase())throw Error('Enter a valid question and two different answers.');db.customPolls.unshift({id:'cp-'+uid(),talent:null,question,a,b,av:0,bv:0,owner:u.email});save();ui.modal=null;toast('Community poll published locally.');go('/reach');return}
if(id==='new-update'){if(!u?.applications?.[0])throw Error('There is no application.');const title=formStr(fd,'title'),body=formStr(fd,'body');if(title.length<5||body.length<15)throw Error('Add more detail to this progress note.');u.applications[0].updates.push({title,body,at:NOW().toISOString(),status:'self-reported'});notify(u,'Progress note published',title);save();ui.modal=null;toast('Progress note saved.');go('/application');return}
}catch(error){toast(error?.message||'Something went wrong. Please try again.')}}
async function handleClick(e){const goBtn=e.target.closest('[data-go]');if(goBtn){e.preventDefault();go(goBtn.dataset.go);window.scrollTo(0,0);return}const filter=e.target.closest('[data-filter]');if(filter){ui.marketFilter=filter.dataset.filter;render();return}const sort=e.target.closest('[data-sort]');if(sort){ui.marketSort=sort.dataset.sort;render();return}const cat=e.target.closest('[data-category]');if(cat){ui.category=cat.dataset.category;render();return}const tab=e.target.closest('[data-talent-tab]');if(tab){ui.talentTab=tab.dataset.talentTab;render();return}const mtab=e.target.closest('[data-market-tab]');if(mtab){ui.marketTab=mtab.dataset.marketTab;render();return}const period=e.target.closest('[data-period]');if(period){ui.marketPeriod=period.dataset.period;render();return}const side=e.target.closest('[data-side]');if(side){ui.selectedSide=side.dataset.side;render();return}const quick=e.target.closest('[data-quick-amount]');if(quick){ui.amount=Number(quick.dataset.quickAmount);const input=document.getElementById('order-amount');if(input)input.value=ui.amount;orderPreview();return}const node=e.target.closest('[data-action]');if(!node)return;if(node.classList.contains('overlay')&&e.target.closest('[data-stop]'))return;const action=node.dataset.action;const u=user();
switch(action){case 'drawer':ui.drawer=true;render();return;case 'close-drawer':ui.drawer=false;render();return;case 'language':showModal('language');return;case 'close-modal':closeModal();return;case 'try-demo':await tryDemo();return;case 'signup-back':ui.authStep=Math.max(1,ui.authStep-1);render();return;case 'resend-signup':ui.signup.code=otp();render();return;case 'reset-back':ui.resetStep=Math.max(1,ui.resetStep-1);render();return;case 'resend-reset':ui.reset.code=otp();render();return;case 'topup':if(!requireAuth('/wallet'))return;showModal('topup');return;case 'confirm-topup':if(!u)return;u.balance=Number((u.balance+1000).toFixed(2));transaction(u,'credit','Demo test credit refill',1000);notify(u,'Added test credits','1,000 fictional DSC credited to your local wallet.');save();ui.modal=null;toast('1,000 virtual DSC credits added.');render();return;
case 'confirm-order':{if(!u||!ui.modal)return;const z=ui.modal,m=market(z.id);if(m.resolved){toast('This market has been settled.');closeModal();return}const nowPrice=z.side==='YES'?m.yes:100-m.yes;if(z.price!==nowPrice){toast('Price changed. Review the quote again.');closeModal();return}if(u.balance<z.cost){toast('Insufficient demo credits.');closeModal();return}u.balance=Number((u.balance-z.cost).toFixed(2));u.positions.push({id:uid(),marketId:z.id,side:z.side,shares:z.shares,entryPrice:z.price,cost:z.cost,openedAt:NOW().toISOString()});transaction(u,'buy',`Bought ${fmt(z.shares)} ${z.side} shares · ${m.cat}`,-z.cost);notify(u,'Demo order filled',`${fmt(z.shares)} ${z.side} shares added to your portfolio.`);changeMarketPrice(z.id,z.side,z.cost,true);save();ui.modal=null;toast('Demo order filled. Your position is in Wallet.');go('/wallet');return}
case 'sell':if(!requireAuth('/wallet'))return;showModal('sell',{id:node.dataset.id});return;case 'fund':if(!requireAuth(currentRoute()))return;showModal('fund',{talent:node.dataset.talent,resource:node.dataset.resource});return;
case 'settle':if(!requireAuth(currentRoute()))return;showModal('settle',{id:node.dataset.id});return;case 'confirm-settle':{if(!ui.modal)return;const id=ui.modal.id,m=market(id),outcome=node.dataset.outcome;if(!m||m.resolved)return;db.marketChanges[id]={...(db.marketChanges[id]||{}),resolved:outcome,yes:outcome==='YES'?100:0};for(const x of Object.values(db.users)){const positions=x.positions.filter(p=>p.marketId===id);let payout=0;for(const p of positions){const win=p.side===outcome?p.shares:0;payout+=win;transaction(x,'settle',`Settled ${p.side} shares · ${m.cat} (${outcome} won)`,win)}x.positions=x.positions.filter(p=>p.marketId!==id);x.balance=Number((x.balance+payout).toFixed(2));if(positions.length)notify(x,'Market settled',`${m.cat} resolved ${outcome}; ${fmt(payout)} DSC paid on winning demo shares.`)}save();ui.modal=null;toast(`Market resolved ${outcome}. Demo settlements posted.`);go('/market/'+id);return}
case 'follow':if(!requireAuth(currentRoute()))return;{const id=node.dataset.id,i=u.following.indexOf(id);if(i<0){u.following.push(id);notify(u,'Following talent',`You'll see ${talent(id)?.alias}'s demo programme in Activity.`);toast('Now following this talent.')}else{u.following.splice(i,1);toast('Unfollowed talent.')}save();render();return}
case 'vote':if(!requireAuth(currentRoute()))return;{const id=node.dataset.id,option=node.dataset.option;if(u.votes[id]){toast('You already voted in this poll.');return}const base=polls().find(p=>p.id===id);if(!base)return;db.pollChanges[id]={av:base.av+(option==='A'?1:0),bv:base.bv+(option==='B'?1:0)};u.votes[id]=option;notify(u,'Community vote saved',`Your vote for ${base.question} was recorded in this local demo.`);save();toast('Vote recorded. Poll results are now visible.');render();return}
case 'create-poll':if(!requireAuth('/reach'))return;showModal('create-poll');return;case 'logout':if(!u)return;showModal('logout');return;case 'confirm-logout':db.session=null;save();ui.modal=null;ui.afterAuth=null;toast('Signed out.');go('/');return;case 'export':if(!requireAuth('/wallet'))return;exportCsv();return;case 'edit-profile':if(!u)return;showModal('edit-profile');return;case 'change-password':if(!u)return;showModal('change-password');return;case 'delete-account':if(!u)return;showModal('delete-account');return;case 'apply-back':ui.applyStep=Math.max(1,ui.applyStep-1);render();return;case 'new-update':if(!requireAuth('/application'))return;showModal('new-update');return;
}}
function handleInput(e){const id=e.target.id;if(id==='market-search'){ui.search=e.target.value;const el=document.getElementById('markets-output');if(el)el.innerHTML=marketList()}else if(id==='talent-search'){ui.talentSearch=e.target.value;const el=document.getElementById('talents-output');if(el)el.innerHTML=initialTalents.map(t=>talent(t.id)).filter(t=>(`${t.alias} ${t.niche} ${t.tagline}`.toLowerCase().includes(ui.talentSearch.toLowerCase()))).filter(t=>ui.category==='ALL'||t.niche.includes(ui.category)).map(talentCard).join('')||blank('No talents found.')}else if(id==='order-amount'){ui.amount=Number(e.target.value);orderPreview()}}

function resourceTransaction(u,type,label,amount){u.resourceTransactions.push({id:uid(),type,label,amount:Number(amount.toFixed(2)),at:NOW().toISOString()})}
function bar(){return ''}
function drawer(){return ''}
function nav(){return ''}
function landing(){return talentsPage()}
function money(v){return fmt(v,2)+' units'}
function walletPage(){const u=user();return `<div class="container"><div class="eyebrow">TALENT / 365 · SIMULATION ONLY</div><h1>Simulation balances.</h1><div class="stack-stat"><div><div class="label">FORECAST CREDITS</div><strong class="value">${fmt(u.balance,2)}</strong><p class="small">Free, nontransferable and nonredeemable. Forecasts only.</p><button class="btn secondary small" data-action="topup">Add free forecast credits</button></div><div><div class="label">RESOURCE UNITS</div><strong class="value">${fmt(u.resourceBalance,2)}</strong><p class="small">Separate practice budget. Not money or forecast credits.</p></div></div><div class="section-head"><h2>Forecast positions</h2></div>${u.positions.length?u.positions.map(p=>positionForMarket(u,p.marketId)).filter((v,i,a)=>a.indexOf(v)===i).join(''):blank('No simulated positions yet.','Explore forecasts','/markets')}<div class="section-head"><h2>Resource allocations</h2></div>${u.resourceTransactions.length?u.resourceTransactions.slice().reverse().map(tx=>`<div class="activity-item"><div class="row"><strong>${escaped(tx.label)}</strong><span class="mono">${fmt(tx.amount,2)} units</span></div></div>`).join(''):blank('No practice allocations yet.','Explore talent','/talents')}<div class="section-head"><h2>Forecast history</h2><button class="btn small secondary" data-action="export">${icon('download')} Export CSV</button></div>${u.transactions.slice().reverse().map(tx=>`<div class="activity-item"><div class="row"><strong>${escaped(tx.label)}</strong><span class="mono">${fmt(tx.amount,2)} credits</span></div></div>`).join('')}<div class="notice">Device-local simulation only. These balances never change your DiSTRUB account wallet. Forecast credits cannot fund resources, pay for services or be redeemed.</div></div>`}
function embeddedNavigation(){const route=currentRoute();return `<nav class="embedded-nav" aria-label="Talent simulation navigation">${[['/talents','Talents'],['/markets','Milestone forecasts'],['/activity','Activity'],['/wallet','Simulation balances'],['/reach','Audience polls'],['/guide','Programme guide']].map(([path,label])=>`<button class="chip ${route===path?'active':''}" data-go="${path}">${label}</button>`).join('')}</nav>`}
const guestKey='talent365-local-simulation';
if(!db.users[guestKey]){const guest=accountData('Simulation explorer','', '', '', '', 'explorer', []);guest.resourceBalance=10000;guest.resourceTransactions=[];db.users={[guestKey]:guest}}
db.session=guestKey;
const guest=user();if(!Number.isFinite(guest.resourceBalance))guest.resourceBalance=10000;if(!Array.isArray(guest.resourceTransactions))guest.resourceTransactions=[];
save();

document.addEventListener('click',e=>{handleClick(e).catch(err=>toast(err.message||'Unexpected demo error.'))});document.addEventListener('submit',e=>{handleForm(e).catch(err=>toast(err.message||'Unexpected demo error.'))});document.addEventListener('input',handleInput);window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'})});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal();else if(e.key==='Escape'&&ui.drawer){ui.drawer=false;render()}});render();
})();
</script>
</body>
