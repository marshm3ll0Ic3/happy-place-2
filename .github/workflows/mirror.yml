name: Mirror to Both Repos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror to my-happy-place & happy-place-2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIRROR_TO_MAIN_KEY }}" > ~/.ssh/key_main
          echo "${{ secrets.MIRROR_TO_HP2_KEY }}" > ~/.ssh/key_hp2
          chmod 600 ~/.ssh/key_main ~/.ssh/key_hp2
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<EOF
          Host github-main
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_main
            IdentitiesOnly yes

          Host github-hp2
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_hp2
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Push to my-happy-place
        run: |
          git remote add target-main git@github-main:marshm3ll0Ic3/my-happy-place.git
          git push target-main HEAD:main --force
          echo "✅ Pushed to my-happy-place"

      - name: Push to happy-place-2
        run: |
          git remote add target-hp2 git@github-hp2:marshm3ll0Ic3/happy-place-2.git
          git push target-hp2 HEAD:main --force
          echo "✅ Pushed to happy-place-2"
